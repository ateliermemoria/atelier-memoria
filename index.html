<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #332b28;
    padding: 30px 18px;

    background-color: #f7f3ee;

    /* Zarif botanik desen */
    background-image:
      radial-gradient(
        circle at 10% 15%,
        rgba(139, 117, 103, 0.10) 0,
        rgba(139, 117, 103, 0.10) 2px,
        transparent 3px
      ),
      radial-gradient(
        circle at 90% 80%,
        rgba(139, 117, 103, 0.08) 0,
        rgba(139, 117, 103, 0.08) 2px,
        transparent 3px
      ),
      linear-gradient(
        135deg,
        transparent 0%,
        rgba(160, 137, 120, 0.035) 45%,
        transparent 46%
      );

    background-size:
      55px 55px,
      70px 70px,
      100% 100%;
  }

  .container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    text-align: center;
  }

  .logo {
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #8a7567;
    margin-bottom: 28px;
  }

  h1 {
    font-family: Georgia, serif;
    font-size: 34px;
    font-weight: normal;
    line-height: 1.2;
    margin: 0 0 8px;
    color: #332b28;
  }

  .subtitle {
    font-family: Georgia, serif;
    font-size: 14px;
    line-height: 1.8;
    color: #756963;
    margin-bottom: 30px;
  }

  .card {
    background: rgba(255, 255, 255, 0.96);
    border-radius: 26px;
    padding: 30px 22px;
    box-shadow:
      0 15px 45px rgba(80, 60, 45, 0.10);
    border: 1px solid rgba(180, 155, 135, 0.18);
  }

  .upload-area {
    border: 1px solid #d8c9bc;
    border-radius: 20px;
    padding: 28px 16px;
    background: rgba(250, 247, 243, 0.75);
  }

  .camera {
    font-size: 38px;
    margin-bottom: 12px;
  }

  .couple-name {
    font-family: Georgia, serif;
    font-size: 27px;
    font-weight: normal;
    color: #332b28;
    margin-bottom: 8px;
  }

  .upload-title {
    font-family: Georgia, serif;
    font-size: 19px;
    margin-bottom: 7px;
  }

  .upload-text {
    font-size: 13px;
    line-height: 1.7;
    color: #8a7d76;
    margin-bottom: 24px;
  }

  .form-group {
    text-align: left;
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.3px;
    margin-bottom: 7px;
    color: #5f554f;
  }

  input,
  textarea {
    width: 100%;
    border: 1px solid #ddd2ca;
    border-radius: 13px;
    padding: 13px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    outline: none;
    background: #fff;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  input:focus,
  textarea:focus {
    border-color: #a99382;
  }

  input[type="file"] {
    display: none;
  }

  .button {
    display: inline-block;
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 14px 20px;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    transition: 0.2s ease;
  }

  .button:hover {
    transform: translateY(-1px);
  }

  .button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .upload-button {
    margin-top: 8px;
    background: #332b28;
    color: white;
  }

  .video-button {
    background: #756154;
  }

  .gallery-button {
    margin-top: 14px;
    background: #eee5dc;
    color: #332b28;
  }

  .file-name {
    font-size: 12px;
    color: #8a7d76;
    margin-top: 12px;
    line-height: 1.6;
  }

  .selected-list {
    text-align: left;
    margin-top: 10px;
    font-size: 12px;
    color: #756963;
    line-height: 1.7;
  }

  .status {
    margin-top: 15px;
    font-size: 13px;
    line-height: 1.5;
  }

  .gallery {
    margin-top: 30px;
    display: none;
  }

  .gallery h2 {
    font-family: Georgia, serif;
    font-size: 26px;
    font-weight: normal;
    margin-bottom: 20px;
  }

  .photo-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow:
      0 7px 25px rgba(80, 60, 45, 0.08);
    text-align: left;
  }

  .photo-card img,
  .photo-card video {
    width: 100%;
    display: block;
    max-height: 550px;
    object-fit: cover;
    background: #000;
  }

  .photo-card video {
    object-fit: contain;
  }

  .photo-info {
    padding: 16px;
  }

  .photo-name {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
  }

  .photo-note {
    font-size: 13px;
    line-height: 1.6;
    color: #756963;
  }

  .empty {
    color: #8a7d76;
    font-size: 13px;
    padding: 15px;
  }

  .footer {
    margin-top: 30px;
    font-size: 10px;
    color: #a0958e;
    letter-spacing: 2px;
  }
</style>
