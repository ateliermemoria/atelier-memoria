<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atelier Memoria</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #332b28;
      padding: 30px 18px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      text-align: center;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #8a7567;
      margin-bottom: 25px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 38px;
      font-weight: normal;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.6;
      color: #756963;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 35px rgba(80, 60, 45, 0.08);
    }

    .upload-area {
      border: 1.5px dashed #cbbcaf;
      border-radius: 18px;
      padding: 28px 15px;
    }

    .camera {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .upload-title {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .upload-text {
      font-size: 13px;
      line-height: 1.6;
      color: #8a7d76;
      margin-bottom: 22px;
    }

    .couple-name {
      font-family: Georgia, serif;
      font-size: 24px;
      margin-bottom: 8px;
      color: #332b28;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
      color: #5f554f;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd2ca;
      border-radius: 12px;
      padding: 13px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #9d8879;
    }

    input[type="file"] {
      display: none;
    }

    .button {
      display: inline-block;
      width: 100%;
      background: #332b28;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
    }

    .button:hover {
      opacity: 0.9;
    }

    .button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .upload-button {
      margin-top: 8px;
    }

    .video-button {
      background: #6f5a4e;
    }

    .gallery-button {
      margin-top: 12px;
      background: #f0e9e2;
      color: #332b28;
    }

    .file-name {
      font-size: 12px;
      color: #8a7d76;
      margin-top: 12px;
      word-break: break-word;
      line-height: 1.6;
    }

    .status {
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .gallery {
      margin-top: 25px;
      display: none;
    }

    .gallery h2 {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: normal;
      margin-bottom: 18px;
    }

    .photo-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(80, 60, 45, 0.08);
      text-align: left;
    }

    .photo-card img,
    .photo-card video {
      width: 100%;
      display: block;
      max-height: 550px;
      object-fit: cover;
      background: #000;
    }

    .photo-card video {
      object-fit: contain;
    }

    .photo-info {
      padding: 15px;
    }

    .photo-name {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .photo-note {
      font-size: 13px;
      line-height: 1.5;
      color: #756963;
    }

    .empty {
      color: #8a7d76;
      font-size: 13px;
      padding: 15px;
    }

    .footer {
      margin-top: 28px;
      font-size: 11px;
      color: #a0958e;
      letter-spacing: 1px;
    }

    .selected-list {
      text-align: left;
      margin-top: 12px;
      font-size: 12px;
      color: #756963;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">Atelier Memoria</div>

  <!-- ÇİFT İSMİ BURADA GÖRÜNECEK -->
  <h1 id="eventTitle">
    Anılar burada başlar.
  </h1>

  <div class="subtitle" id="eventSubtitle">
    Bu özel güne ait fotoğraf ve videolarınızı<br>
    bizimle paylaşın ve anılara ortak olun.
  </div>

  <div class="card">

    <div class="upload-area">

      <div class="camera">📸</div>

      <div
        class="couple-name"
        id="coupleName"
      ></div>

      <div class="upload-title">
        Bir anı bırak 💌
      </div>

      <div class="upload-text">
        Fotoğraf veya videolarınızı seçin,<br>
        adınızı ve dilerseniz bir not bırakın.
      </div>


      <!-- AD -->

      <div class="form-group">

        <label for="name">
          Adınız
        </label>

        <input
          type="text"
          id="name"
          placeholder="Örn. Büşra"
          maxlength="60"
        >

      </div>


      <!-- NOT -->

      <div class="form-group">

        <label for="note">
          Notunuz
        </label>

        <textarea
          id="note"
          placeholder="Bu güzel güne küçük bir not bırakın..."
          maxlength="500"
        ></textarea>

      </div>


      <!-- FOTOĞRAF SEÇ -->

      <label
        for="photo"
        class="button upload-button"
      >
        📷 Fotoğraf Seç
      </label>

      <input
        type="file"
        id="photo"
        accept="image/*"
        multiple
      >


      <!-- FOTOĞRAF YÜKLE -->

      <button
        id="photoUploadButton"
        class="button upload-button"
        type="button"
      >
        📷 Fotoğrafları Paylaş
      </button>


      <!-- VİDEO SEÇ -->

      <label
        for="video"
        class="button upload-button video-button"
      >
        🎥 Video Seç
      </label>

      <input
        type="file"
        id="video"
        accept="video/*"
        multiple
      >


      <!-- VİDEO YÜKLE -->

      <button
        id="videoUploadButton"
        class="button upload-button video-button"
        type="button"
      >
        🎥 Videoları Paylaş
      </button>


      <!-- SEÇİLEN DOSYALAR -->

      <div
        id="fileName"
        class="file-name"
      >
        Henüz dosya seçilmedi.
      </div>

      <div
        id="selectedList"
        class="selected-list"
      ></div>


      <!-- DURUM -->

      <div
        id="status"
        class="status"
      ></div>

    </div>


    <!-- GALERİ -->

    <button
      id="galleryButton"
      class="button gallery-button"
      type="button"
    >
      🖼️ Anıları Gör
    </button>

  </div>


  <div
    id="gallery"
    class="gallery"
  >

    <h2 id="galleryTitle">
      Bu Günden Kalanlar
    </h2>

    <div id="galleryContent"></div>

  </div>


  <div class="footer">
    ATELIER MEMORIA • YOUR MOMENTS, FOREVER
  </div>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://hokwiohkbceiyffqwrbn.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_6BRruSgb5EKyMhP7CSOwzw_KrcaXOWq";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ETKİNLİK KODLARI
   ===================================================== */

/*
   BURAYA YENİ ÇİFTLER EKLEYEBİLİRSİN.

   ÖRNEK:

   ?event=busra-yasar

   sonucunda:

   Büşra & Yaşar Wedding
   Büşra & Yaşar için bir anı bırak 💌

*/

const EVENTS = {

  "busra-yasar": {
    couple: "Büşra & Yaşar",
    title: "Büşra & Yaşar Wedding"
  },

  "demo": {
    couple: "Büşra & Yaşar",
    title: "Büşra & Yaşar Wedding"
  }

};


/* =====================================================
   URL'DEN ETKİNLİK KODUNU AL
   ===================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );

const EVENT_CODE =
  urlParams.get("event") || "demo";


/* =====================================================
   ETKİNLİK BİLGİSİ
   ===================================================== */

const EVENT =
  EVENTS[EVENT_CODE] || EVENTS["demo"];


/* =====================================================
   SAYFADAKİ İSİMLERİ DEĞİŞTİR
   ===================================================== */

document.title =
  EVENT.title + " • Atelier Memoria";


document.getElementById(
  "eventTitle"
).textContent =
  EVENT.title;


document.getElementById(
  "coupleName"
).textContent =
  EVENT.couple;


document.getElementById(
  "eventSubtitle"
).innerHTML =
  EVENT.couple +
  " için bir anı bırakın 💌<br>" +
  "Fotoğraf ve videolarınızı paylaşın.";


document.getElementById(
  "galleryTitle"
).textContent =
  EVENT.couple +
  " • Anılar";


/* =====================================================
   ELEMENTLER
   ===================================================== */

const photoInput =
  document.getElementById("photo");

const videoInput =
  document.getElementById("video");

const fileName =
  document.getElementById("fileName");

const selectedList =
  document.getElementById("selectedList");

const nameInput =
  document.getElementById("name");

const noteInput =
  document.getElementById("note");

const photoUploadButton =
  document.getElementById(
    "photoUploadButton"
  );

const videoUploadButton =
  document.getElementById(
    "videoUploadButton"
  );

const galleryButton =
  document.getElementById(
    "galleryButton"
  );

const status =
  document.getElementById("status");

const gallery =
  document.getElementById("gallery");

const galleryContent =
  document.getElementById(
    "galleryContent"
  );


/* =====================================================
   FOTOĞRAF SEÇİLDİ
   ===================================================== */

photoInput.addEventListener(
  "change",
  function() {

    const files =
      Array.from(this.files);

    if (files.length === 0) {

      fileName.textContent =
        "Henüz fotoğraf seçilmedi.";

      selectedList.innerHTML =
        "";

      return;

    }


    fileName.textContent =
      files.length +
      " fotoğraf seçildi.";


    selectedList.innerHTML =
      files
        .map(
          (file, index) =>
            "📷 " +
            (index + 1) +
            ". " +
            file.name
        )
        .join("<br>");

    status.textContent =
      "";

  }
);


/* =====================================================
   VİDEO SEÇİLDİ
   ===================================================== */

videoInput.addEventListener(
  "change",
  function() {

    const files =
      Array.from(this.files);

    if (files.length === 0) {

      fileName.textContent =
        "Henüz video seçilmedi.";

      selectedList.innerHTML =
        "";

      return;

    }


    fileName.textContent =
      files.length +
      " video seçildi.";


    selectedList.innerHTML =
      files
        .map(
          (file, index) =>
            "🎥 " +
            (index + 1) +
            ". " +
            file.name
        )
        .join("<br>");

    status.textContent =
      "";

  }
);


/* =====================================================
   TEK DOSYAYI YÜKLE
   ===================================================== */

async function uploadSingleFile(
  file,
  type,
  index,
  total
) {

  /* İSİM */

  const name =
    nameInput.value.trim();


  /* NOT */

  const note =
    noteInput.value.trim();


  /* DOSYA */

  if (!file) {

    throw new Error(
      "Dosya seçilmedi."
    );

  }


  /* DOSYA TÜRÜ */

  if (
    type === "photo" &&
    !file.type.startsWith("image/")
  ) {

    throw new Error(
      "Geçersiz fotoğraf dosyası."
    );

  }


  if (
    type === "video" &&
    !file.type.startsWith("video/")
  ) {

    throw new Error(
      "Geçersiz video dosyası."
    );

  }


  /* BOYUT */

  const maxSize =
    type === "photo"
      ? 10 * 1024 * 1024
      : 100 * 1024 * 1024;


  if (file.size > maxSize) {

    throw new Error(
      type === "photo"
        ? file.name +
          " 10 MB'dan büyük."
        : file.name +
          " 100 MB'dan büyük."
    );

  }


  /* UZANTI */

  const extension =
    file.name.includes(".")
      ? file.name
          .split(".")
          .pop()
          .toLowerCase()
      : "";


  /* BENZERSİZ İSİM */

  const generatedFileName =
    Date.now() +
    "-" +
    crypto.randomUUID() +
    (
      extension
        ? "." + extension
        : ""
    );


  /* KLASÖR */

  const filePath =
    EVENT_CODE +
    "/" +
    generatedFileName;


  /* ================================================
     STORAGE
     ================================================ */

  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from("event-files")
      .upload(
        filePath,
        file,
        {
          contentType:
            file.type,

          upsert:
            false
        }
      );


  if (uploadError) {

    throw uploadError;

  }


  /* ================================================
     PUBLIC URL
     ================================================ */

  const {
    data: publicUrlData
  } =
    supabaseClient
      .storage
      .from("event-files")
      .getPublicUrl(
        filePath
      );


  const fileUrl =
    publicUrlData.publicUrl;


  /* ================================================
     VERİTABANI
     ================================================ */

  const {
    error: databaseError
  } =
    await supabaseClient
      .from("event_photos")
      .insert({

        event_code:
          EVENT_CODE,

        file_path:
          filePath,

        file_url:
          fileUrl,

        uploader_name:
          name,

        note:
          note || null

      });


  if (databaseError) {

    throw databaseError;

  }


  return true;

}


/* =====================================================
   ÇOKLU DOSYA YÜKLEME
   ===================================================== */

async function uploadMultipleFiles(
  files,
  type
) {

  const fileArray =
    Array.from(files);


  if (
    fileArray.length === 0
  ) {

    status.textContent =
      type === "photo"
        ? "Lütfen önce fotoğraf seçin."
        : "Lütfen önce video seçin.";

    return;

  }


  /* İSİM ZORUNLU */

  if (
    !nameInput.value.trim()
  ) {

    status.textContent =
      "Lütfen adınızı yazın.";

    nameInput.focus();

    return;

  }


  /* BUTONLARI KİLİTLE */

  photoUploadButton.disabled =
    true;

  videoUploadButton.disabled =
    true;


  let successCount = 0;


  try {

    for (
      let i = 0;
      i < fileArray.length;
      i++
    ) {

      status.textContent =
        (
          type === "photo"
            ? "📷 Fotoğraflar"
            : "🎥 Videolar"
        ) +
        " yükleniyor... " +
        (i + 1) +
        " / " +
        fileArray.length;


      await uploadSingleFile(
        fileArray[i],
        type,
        i,
        fileArray.length
      );


      successCount++;

    }


    status.textContent =
      "✨ " +
      successCount +
      " " +
      (
        type === "photo"
          ? "fotoğraf"
          : "video"
      ) +
      " başarıyla paylaşıldı.";


    /* SEÇİMLERİ TEMİZLE */

    if (type === "photo") {

      photoInput.value =
        "";

    } else {

      videoInput.value =
        "";

    }


    fileName.textContent =
      "Henüz dosya seçilmedi.";

    selectedList.innerHTML =
      "";


    /* GALERİ */

    await loadGallery();


  } catch (error) {

    console.error(
      "Yükleme hatası:",
      error
    );


    status.textContent =
      "Bir dosya yüklenirken sorun oluştu: " +
      error.message;

  }


  photoUploadButton.disabled =
    false;

  videoUploadButton.disabled =
    false;

}


/* =====================================================
   FOTOĞRAFLARI PAYLAŞ
   ===================================================== */

photoUploadButton.addEventListener(
  "click",
  async function() {

    await uploadMultipleFiles(
      photoInput.files,
      "photo"
    );

  }
);


/* =====================================================
   VİDEOLARI PAYLAŞ
   ===================================================== */

videoUploadButton.addEventListener(
  "click",
  async function() {

    await uploadMultipleFiles(
      videoInput.files,
      "video"
    );

  }
);


/* =====================================================
   GALERİ BUTONU
   ===================================================== */

galleryButton.addEventListener(
  "click",
  loadGallery
);


/* =====================================================
   GALERİYİ YÜKLE
   ===================================================== */

async function loadGallery() {

  gallery.style.display =
    "block";


  galleryContent.innerHTML =
    '<div class="empty">Anılar yükleniyor...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("event_photos")
      .select("*")
      .eq(
        "event_code",
        EVENT_CODE
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    galleryContent.innerHTML =
      '<div class="empty">Anılar yüklenemedi.</div>';

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    galleryContent.innerHTML =
      '<div class="empty">Henüz anı paylaşılmamış.</div>';

    return;

  }


  galleryContent.innerHTML =
    "";


  data.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "photo-card";


      const filePath =
        (
          item.file_path ||
          ""
        ).toLowerCase();


      const isVideo =
        filePath.endsWith(".mp4") ||
        filePath.endsWith(".mov") ||
        filePath.endsWith(".webm") ||
        filePath.endsWith(".m4v") ||
        filePath.endsWith(".avi") ||
        filePath.endsWith(".mkv");


      /* MEDYA */

      if (isVideo) {

        const video =
          document.createElement(
            "video"
          );

        video.src =
          item.file_url;

        video.controls =
          true;

        video.playsInline =
          true;

        video.preload =
          "metadata";


        card.appendChild(
          video
        );

      } else {

        const image =
          document.createElement(
            "img"
          );

        image.src =
          item.file_url;

        image.alt =
          EVENT.couple;


        card.appendChild(
          image
        );

      }


      /* BİLGİ */

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "photo-info";


      const person =
        document.createElement(
          "div"
        );

      person.className =
        "photo-name";


      person.textContent =
        "♡ " +
        (
          item.uploader_name ||
          "Anonim"
        );


      const note =
        document.createElement(
          "div"
        );

      note.className =
        "photo-note";


      note.textContent =
        item.note || "";


      info.appendChild(
        person
      );


      if (item.note) {

        info.appendChild(
          note
        );

      }


      card.appendChild(
        info
      );


      galleryContent.appendChild(
        card
      );

    }
  );

}

</script>

</body>
</html>
