<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Memoria</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f0;
      color: #3d3028;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 60px 25px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #75675d;
      line-height: 1.6;
    }

    .box {
      background: white;
      padding: 30px;
      margin-top: 35px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    button {
      background: #3d3028;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Atelier Memoria</h1>

    <p>
      Anılarınızı bizimle paylaşın.
      Fotoğraf ve videolarınızı güvenle yükleyebilirsiniz.
    </p>

    <div class="box">
      <h2>Anınızı Yükleyin</h2>

      <p>
        Fotoğraf veya videonuzu seçerek
        anılarınıza katkıda bulunabilirsiniz.
      </p>

      <input type="file" accept="image/,video/" multiple>

      <br>

      <button>Fotoğrafları Yükle</button>
    </div>

  </div>

</body>
</html>
